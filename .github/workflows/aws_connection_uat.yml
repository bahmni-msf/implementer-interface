name: Deploy to qa
on:
  push:
    branches:
      - githubActions
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install OpenVPN
        run: |
          sudo apt update
          sudo apt install -y openvpn openvpn-systemd-resolved
      - name: Connect to VPN
        uses: "kota65535/github-openvpn-connect-action@v2"
        with:
          config_file: .github/workflows/client.ovpn
          username: ${{ secrets.UAT_OVPN_USERNAME }}
          password: ${{ secrets.UAT_OVPN_PASSWORD }}
      - name: Deploy
        env:
          PRIVATE_KEY: ${{ secrets.BAHMNI_LITE_AWS_UAT_SSH_PRIVATE_KEY }}
          USER_NAME: ${{secrets.BAHMNI_LITE_AWS_UAT_MALAWI_SSH_USER_NAME}}
          HOSTNAME: ${{secrets.BAHMNI_LITE_AWS_UAT_MALAWI_SSH_HOST}}
        run: |
          echo "$PRIVATE_KEY" > ~/private_key.pem && chmod 400 ~/private_key.pem
          ssh -i ~/private_key.pem -o StrictHostKeyChecking=no ${USER_NAME}@${HOSTNAME} '
          ls -al
          "
          rm ~/private_key.pem
          '