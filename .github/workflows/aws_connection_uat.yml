name: Deploy to qa
on:
  push:
    branches:
      - githubActions
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set Up OpenVPN
        env:
          OPENVPN_CONFIG: ${{ secrets.UAT_OVPN_FILE }}
          OPENVPN_CREDENTIALS: '${{ secrets.UAT_OVPN_USERNAME }}\n${{ secrets.UAT_OVPN_PASSWORD }}'
        run: |
          sudo apt-get update
          sudo apt-get install -y openvpn
          echo "$OPENVPN_CREDENTIALS"
          echo "$OPENVPN_CONFIG" | sudo tee /etc/openvpn/client.conf > /dev/null
          echo "$OPENVPN_CREDENTIALS" | sudo tee -a /etc/openvpn/client.conf > /dev/null

      - name: Start OpenVPN Connection
        run: sudo openvpn --config /etc/openvpn/client.conf --daemon

      - name: Sleep to Allow VPN Connection
        run: sleep 60
      
      - name: Deploy
        env:
          USER_NAME: ${{secrets.BAHMNI_LITE_AWS_UAT_MALAWI_SSH_USER_NAME}}
          HOSTNAME: ${{secrets.BAHMNI_LITE_AWS_UAT_MALAWI_SSH_HOST}}
        run: |
          ssh -i ~/private_key.pem -o StrictHostKeyChecking=no ${USER_NAME}@${HOSTNAME} '
          ls -al
          '